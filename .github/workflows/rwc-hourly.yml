name: Hourly Rugby World Cup 2027 prediction update

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # A newer run supersedes an older one still waiting on GitHub's Pages queue,
  # so slow deploys can't pile up and block each other.
  group: rwc-hourly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rugby/requirements.txt

      # Fail the run LOUDLY (red X) if ESPN starts bot-blocking us again, so a
      # silent ingestion freeze can't masquerade as a healthy hourly heartbeat.
      # Checks reachability only (a recent-date scoreboard fetch), NOT whether
      # results changed — quiet weeks with no new matches stay green. Retries
      # absorb transient blips; a persistent 403 means ESPN is blocking the
      # tool-style User-Agent again — rotate it in ingest.py + official.py.
      - name: ESPN reachability check (fail loudly on bot-block)
        run: |
          python - <<'PY'
          import urllib.request, sys, time
          from datetime import date
          UA = "curl/8.7.1"  # keep in sync with rugby/ingest.py + rugby/official.py
          LEAGUES = {"RWC": 164205, "Nations Championship": 17567}
          d = date.today().strftime("%Y%m%d")
          base = "https://site.api.espn.com/apis/site/v2/sports/rugby/{}/scoreboard?dates=" + d
          bad = []
          for name, lid in LEAGUES.items():
              ok, last = False, None
              for _ in range(3):
                  try:
                      req = urllib.request.Request(base.format(lid), headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          if r.status == 200:
                              ok = True
                              break
                          last = f"HTTP {r.status}"
                  except Exception as e:
                      last = f"{type(e).__name__}: {getattr(e, 'code', e)}"
                  time.sleep(5)
              print(f"  {name} ({lid}): {'OK' if ok else last}")
              if not ok:
                  bad.append(f"{name} ({lid}) -> {last}")
          if bad:
              print("::error::ESPN scoreboard API unreachable for: " + "; ".join(bad)
                    + f". If these are 403s, ESPN is bot-blocking the '{UA}' User-Agent again"
                    + " (rugby/ingest.py + rugby/official.py) — rotate to another tool-style UA"
                    + " with a name/version token. Ingestion is FROZEN until fixed.")
              sys.exit(1)
          print("ESPN reachable — ingestion path healthy.")
          PY

      - name: Install dependencies
        run: pip install -r rugby/requirements.txt

      - name: Confirm live results (ledger-validated)
        id: upd
        run: |
          python -m rugby.run update
          if git diff --quiet -- rugby/data/results.csv \
               rugby/data/accepted_results.csv rugby/data/official_results.csv \
               rugby/data/manual_results.csv rugby/data/upcoming_fixtures.csv; then
            echo "sim_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sim_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrain and re-simulate
        if: steps.upd.outputs.sim_changed == 'true'
        run: |
          python -m rugby.run train --skip-validation
          python -m rugby.run simulate --sims 50000

      - name: Rebuild site (heartbeat timestamp)
        run: python -m rugby.site

      - name: Commit and push
        run: |
          git config user.name "rwc-hourly[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rugby/data rugby/outputs
          git commit -m "Hourly update: results ledger, ratings and simulations" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rugby/outputs/site

      # The run's real work (results, ratings, simulations, report) is already
      # committed and pushed above. Publishing is best-effort: GitHub's Pages
      # deployment queue is occasionally slow, so cap the wait and don't fail
      # the whole heartbeat over a transient publish hiccup — the freshly
      # committed site publishes on the next healthy deploy.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 6
        continue-on-error: true
